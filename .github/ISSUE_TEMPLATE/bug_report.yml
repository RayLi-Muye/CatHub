name: Bug report
description: Report a reproducible CatHub defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Do not include secrets, tokens, production data, private reviewer credentials, or raw personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken, and who is affected?
      placeholder: Describe the observed behavior and impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable path to reproduce the issue.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Web app
        - Mobile app
        - Mobile API
        - Database / migrations
        - Release / EAS / store readiness
        - Documentation / governance
        - CI / GitHub Actions
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, failing command output, or live proof. Redact private data.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this issue to be closed?
      placeholder: |
        - [ ] The defect is fixed.
        - [ ] Regression coverage or focused validation is recorded.
        - [ ] Relevant docs are updated or explicitly not impacted.
    validations:
      required: true
